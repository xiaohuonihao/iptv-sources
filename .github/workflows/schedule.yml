name: update schedule

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:  # ← 添加这行，允许手动触发测试

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      matrix:
        node-version: [20.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: |
            echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install
      - run: pnpm build
      - run: pnpm m3u
      - run: sudo apt-get install -y tree

      # ⬇️⬇️⬇️ 从这里开始是新增的压缩步骤 ⬇️⬇️⬇️
      
      - name: Compress large EPG file (fix Cloudflare 25MB limit)
        run: |
          EPG_FILE="m3u/epg/epg_pw.xml"
          if [ -f "$EPG_FILE" ]; then
            SIZE=$(stat -c%s "$EPG_FILE" 2>/dev/null || stat -f%z "$EPG_FILE" 2>/dev/null)
            MAX_SIZE=$((25 * 1024 * 1024))
            
            if [ $SIZE -gt $MAX_SIZE ]; then
              echo "⚠️  EPG 文件过大 ($(numfmt --to=iec $SIZE))，正在压缩..."
              gzip -9 -c "$EPG_FILE" > "${EPG_FILE}.tmp"
              mv "${EPG_FILE}.tmp" "$EPG_FILE"
              NEW_SIZE=$(stat -c%s "$EPG_FILE" 2>/dev/null || stat -f%z "$EPG_FILE" 2>/dev/null)
              echo "✅ 压缩后大小: $(numfmt --to=iec $NEW_SIZE)"
            else
              echo "✅ EPG 文件大小正常 ($(numfmt --to=iec $SIZE))"
            fi
          else
            echo "ℹ️  未找到 epg/epg_pw.xml 文件，跳过压缩"
          fi
      
      # ⬆️⬆️⬆️ 压缩步骤结束 ⬆️⬆️⬆️

      - name: Publish m3u (Cloudflare direct upload or empty commit)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME || secrets.PROJECT_NAME }}
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN}" ]; then
            pnpm static
            tree m3u
            npx wrangler pages deploy m3u --project-name="${PROJECT_NAME}"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: schedule refresh (trigger Cloudflare Pages build)"
            git push
          fi

